name: DED regression

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression suite
        run: npm test

      - name: Upload source export
        uses: actions/upload-artifact@v4
        with:
          name: ded-source-export
          path: |
            src/
            data/matrizes/emti_2026_anonimizada.json
          if-no-files-found: error
